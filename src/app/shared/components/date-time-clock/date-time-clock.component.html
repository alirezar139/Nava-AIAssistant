<div class="date-time-clock" role="status" aria-label="ساعت و تاریخ سامانه">
  <span class="clock-icon-wrap">
    <svg class="clock-icon" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="9" />
      <path d="M12 7v5l3.5 2" />
    </svg>
  </span>
  <span class="clock-copy">
    <span class="time-label" dir="ltr">{{ timeLabel }}</span>
    <span class="date-label">{{ dateLabel }}</span>
  </span>
</div>
